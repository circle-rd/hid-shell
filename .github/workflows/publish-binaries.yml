name: Publish HID-Shell binaries

# Builds the three cross-compiled HID-Shell payloads (Linux x86_64,
# macOS arm64, Windows x86_64) and publishes them as a tiny `FROM scratch`
# OCI image containing just the binaries renamed to the short names the
# vandal-react server expects (sl, sm, sw.exe).
#
# The vandal-react Dockerfile consumes this image via:
#
#     FROM ghcr.io/${{ github.repository_owner }}/hid-shell-binaries:latest AS hid-shell-bins
#     COPY --from=hid-shell-bins / /app/server/assets/hid-shell/

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "hid-shell.nimble"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/publish-binaries.yml"
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/hid-shell-binaries

jobs:
  publish:
    name: Build and push binaries image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags / labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      # Default target = `release` (FROM scratch with sl/sm/sw.exe).
      # The toolchain stage is amd64-only (apt packages), so we publish
      # the binaries image as amd64. The binaries it carries are valid
      # for any host arch since they are pre-cross-compiled.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
