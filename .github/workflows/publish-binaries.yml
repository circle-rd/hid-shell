name: Publish HID-Shell binaries

# Builds the three cross-compiled HID-Shell payloads (Linux x86_64,
# macOS arm64, Windows x86_64) and publishes them as a tiny `FROM scratch`
# OCI image containing just the binaries renamed to the short names the
# vandal-react universal launcher expects (sl, sm, sw.exe).
#
# Triggered ONLY on GitHub Release publication (or manual dispatch) so
# each release produces a single, immutable, semver-tagged image.
#
# Pipeline (mirrors vandal-react/.github/workflows/docker-publish.yml):
#
#   meta ──┬──> build (linux-x86_64)   ──┐
#          ├──> build (macos-arm64)    ──┤──> publish (scratch image)
#          └──> build (windows-x86_64) ──┘
#
# The vandal-react Dockerfile consumes the resulting image via:
#
#     FROM ghcr.io/${{ github.repository_owner }}/hid-shell-binaries:latest AS hid-shell-bins
#     COPY --from=hid-shell-bins / /app/server/assets/hid-shell/

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (defaults to 'manual')"
        required: false
        default: "manual"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/hid-shell-binaries
  # Pinned across all jobs so toolchain cache + final image stay aligned.
  TOOLCHAIN_IMAGE: hid-shell-toolchain:ci

jobs:
  # ─── Compute the tag set once and share it with the per-target builds ──
  meta:
    name: Resolve image tags
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      json: ${{ steps.meta.outputs.json }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-

  # ─── One job per cross-compile target, executed in parallel ───────────
  build:
    name: Build (${{ matrix.target.slug }})
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - slug: linux-x86_64
            script: linux
            artefact: hid_shell-linux-x86_64
            short: sl
          - slug: macos-arm64
            script: macos
            artefact: hid_shell-macos-arm64
            short: sm
          - slug: windows-x86_64
            script: windows
            artefact: hid_shell-windows-x86_64.exe
            short: sw.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the toolchain stage once per matrix job; the GHA cache is
      # shared across all matrix entries so only the first runner pays
      # the apt + hidapi cost.
      - name: Build toolchain image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: toolchain
          load: true
          tags: ${{ env.TOOLCHAIN_IMAGE }}
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,mode=max,scope=toolchain

      - name: Cross-compile ${{ matrix.target.slug }}
        run: |
          mkdir -p dist
          docker run --rm \
            -v "${PWD}":/workspace \
            -w /workspace \
            "${TOOLCHAIN_IMAGE}" \
            ./scripts/build_all.sh ${{ matrix.target.script }}
          ls -lh dist/

      - name: Stage binary under its short name
        run: |
          mkdir -p /tmp/out
          cp "dist/${{ matrix.target.artefact }}" "/tmp/out/${{ matrix.target.short }}"
          ls -lh /tmp/out/

      - name: Upload binary artefact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target.slug }}
          path: /tmp/out/${{ matrix.target.short }}
          if-no-files-found: error
          retention-days: 1

  # ─── Assemble the three binaries into the final scratch image ────────
  publish:
    name: Publish binaries image
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download all binary artefacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/staged
          pattern: binary-*
          merge-multiple: true

      - name: Inspect staged binaries
        run: ls -lh /tmp/staged/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tiny ad-hoc Dockerfile: FROM scratch + the three pre-built binaries.
      # No build context coupling to the source repo — pure artefact stitching.
      - name: Write release Dockerfile
        run: |
          cat > /tmp/staged/Dockerfile <<'EOF'
          # syntax=docker/dockerfile:1.6
          FROM scratch
          COPY sl     /sl
          COPY sm     /sm
          COPY sw.exe /sw.exe
          LABEL org.opencontainers.image.title="HID-Shell binaries"
          LABEL org.opencontainers.image.description="Pre-built HID-Shell payloads for Linux, macOS arm64 and Windows x86_64."
          LABEL org.opencontainers.image.source="https://github.com/${{ github.repository }}"
          EOF
          cat /tmp/staged/Dockerfile

      - name: Build and push binaries image
        uses: docker/build-push-action@v5
        with:
          context: /tmp/staged
          file: /tmp/staged/Dockerfile
          # Multi-platform manifest list. The image only contains pre-cross-
          # compiled static binaries (sl/sm/sw.exe) that are independent of
          # the container's host architecture, so the same blobs are valid
          # under both amd64 and arm64 manifests. This lets multi-arch
          # consumers (e.g. vandal-react nightly builds on arm64 runners)
          # resolve the image without `no match for platform` errors.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.meta.outputs.tags }}
          labels: ${{ needs.meta.outputs.labels }}

      - name: Inspect resulting image
        run: |
          tag="$(jq -cr '.tags[0]' <<< '${{ needs.meta.outputs.json }}')"
          docker buildx imagetools inspect "${tag}"
